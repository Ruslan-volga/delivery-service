<!DOCTYPE html>
<html>

<head>
    <title>WebSocket Chat Test</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .chat-box {
            border: 1px solid #ccc;
            padding: 10px;
            height: 300px;
            overflow-y: scroll;
            margin: 10px 0;
        }

        .message {
            margin: 5px 0;
            padding: 5px;
            background: #f5f5f5;
            border-radius: 5px;
        }

        .status {
            padding: 10px;
            background: #eee;
            margin: 10px 0;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        input {
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 200px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Тестирование WebSocket чата</h1>

        <div class="status" id="status">Статус: Загрузка...</div>

        <div>
            <input type="text" id="userId" placeholder="User ID" value="68d844aee7755d37d6bee37b">
            <input type="text" id="receiverId" placeholder="Receiver ID" value="68d8100656f88a7074505f71">
        </div>

        <div>
            <button onclick="connect()">Подключиться</button>
            <button onclick="authenticate()">Аутентификация</button>
            <button onclick="testPing()">Ping сервер</button>
            <button onclick="getHistory()">История чата</button>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message">Сообщения чата появятся здесь...</div>
        </div>

        <div>
            <input type="text" id="messageInput" placeholder="Введите сообщение">
            <button onclick="sendMessage()">Отправить сообщение</button>
        </div>
    </div>

    <script>
        let socket;
        const statusDiv = document.getElementById('status');
        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('messageInput');
        const userIdInput = document.getElementById('userId');
        const receiverIdInput = document.getElementById('receiverId');

        function addMessage(text, type = 'info') {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';

            const timestamp = new Date().toLocaleTimeString();
            const typeIcons = {
                'info': 'ℹ️',
                'success': '✅',
                'error': '❌',
                'chat': '💬',
                'server': '📡',
                'my-message': '👤'
            };

            messageDiv.innerHTML = `
                <strong>${typeIcons[type] || '📝'} ${type.toUpperCase()}:</strong> 
                ${text} 
                <small style="color: #666;">(${timestamp})</small>
            `;

            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function connect() {
            // Подключаемся к Socket.io серверу
            socket = io('http://localhost:3000');

            socket.on('connect', () => {
                statusDiv.innerHTML = '✅ <strong>Статус:</strong> Подключено к серверу';
                addMessage('Успешно подключен к WebSocket серверу', 'success');
            });

            socket.on('message', (data) => {
                addMessage(`Сервер: ${JSON.stringify(data)}`, 'server');
            });

            socket.on('chat message', (data) => {
                addMessage(`${data.from}: ${data.message}`, 'chat');
            });

            socket.on('pong', (data) => {
                addMessage(`Pong: ${JSON.stringify(data)}`, 'server');
            });

            socket.on('disconnect', () => {
                statusDiv.innerHTML = '❌ <strong>Статус:</strong> Отключено';
                addMessage('Отключен от сервера', 'error');
            });

            socket.on('error', (error) => {
                addMessage(`Ошибка: ${error}`, 'error');
            });
        }

        function authenticate() {
            const userId = userIdInput.value;
            if (socket && socket.connected) {
                socket.emit('authenticate', { userId: userId });
                addMessage(`Отправлен запрос аутентификации для пользователя: ${userId}`, 'info');
            } else {
                addMessage('Сначала подключитесь к серверу!', 'error');
            }
        }

        function testPing() {
            if (socket && socket.connected) {
                const pingData = {
                    test: 'тестовые данные',
                    time: new Date().toISOString(),
                    random: Math.random()
                };
                socket.emit('ping', pingData);
                addMessage(`Отправлен ping: ${JSON.stringify(pingData)}`, 'info');
            } else {
                addMessage('Сначала подключитесь к серверу!', 'error');
            }
        }

        function getHistory() {
            const receiverId = receiverIdInput.value;
            if (socket && socket.connected) {
                addMessage(`Запрос истории чата с пользователем: ${receiverId}`, 'info');
                // В нашей текущей реализации история запрашивается автоматически при аутентификации
            } else {
                addMessage('Сначала подключитесь к серверу!', 'error');
            }
        }

        function sendMessage() {
            const receiverId = receiverIdInput.value;
            const text = messageInput.value.trim();

            if (text && socket && socket.connected) {
                socket.emit('chat message', {
                    message: text
                });
                addMessage(`Вы: ${text}`, 'my-message');
                messageInput.value = '';
            } else if (!text) {
                addMessage('Введите сообщение!', 'error');
            } else {
                addMessage('Сначала подключитесь к серверу!', 'error');
            }
        }

        // Обработка нажатия Enter в поле ввода
        messageInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Автоподключение при загрузке страницы
        window.onload = function () {
            addMessage('Страница загружена. Нажмите "Подключиться" для начала работы.', 'info');
        };
    </script>
</body>

</html>
